# 2026-10-19: signed App Store build -> TestFlight, without a Mac (same method as LocalSync's ios-testflight.yml).
#
# iLoader logins fail at times (Apple changes), and TestFlight is also how outside testers and App Review get the app.
# The unsigned archive ios-build.yml already makes is re-signed here with the Apple Distribution identity and the
# "JobTrack App Store" profile, packaged as an .ipa and uploaded with an App Store Connect API key.
#
# Manual only (Actions tab -> "iOS TestFlight" -> Run workflow): every run uploads a new TestFlight build.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD - Apple Distribution certificate
#   IOS_PROFILE_APP_BASE64                      - "JobTrack App Store" profile (com.kworld.jobtrack)
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8     - App Store Connect API key
name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Web app + Capacitor sync
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Build iOS archive (no signing)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40

      - name: Install certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep "Apple Distribution" | head -1 | awk '{print $2}')
          test -n "$IDENTITY" || { echo "no Apple Distribution identity"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KC=$KC" >> "$GITHUB_ENV"
          echo "$PROFILE_APP" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app.plist"
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/app.plist" > "$RUNNER_TEMP/app.entitlements"
          echo "--- profile entitlements ---"; cat "$RUNNER_TEMP/app.entitlements"

      - name: Sign app
        run: |
          set -euo pipefail
          APP=build/App.xcarchive/Products/Applications/App.app
          # Build number must rise with every upload
          BUILD_NUMBER=$((100 + ${{ github.run_number }}))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist"
          echo "Build $BUILD_NUMBER"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) \
              -exec codesign --force --sign "$IDENTITY" --keychain "$KC" {} \;
          fi
          cp "$RUNNER_TEMP/app.mobileprovision" "$APP/embedded.mobileprovision"
          codesign --force --sign "$IDENTITY" --keychain "$KC" --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/App.xcarchive/Products/Applications/App.app "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry JobTrack.ipa Payload
          ls -l JobTrack.ipa

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP/ipa/JobTrack.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/*.p8 "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.mobileprovision
